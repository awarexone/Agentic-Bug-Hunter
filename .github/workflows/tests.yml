name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

  bugbench:
    name: bugbench (detection-quality gate)
    runs-on: ubuntu-latest
    # NON-BLOCKING while the corpus is small: this reports detection quality on
    # every PR but must not red-gate unrelated PRs if one detector regresses or a
    # newly-added hard case fails. Flip to blocking (remove continue-on-error and
    # make it a required check) once the corpus is broad enough to trust as a gate.
    # NOTE: until then, adding a currently-failing case will show this job red but
    # will NOT block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs the toolkit's detectors against a ground-truth corpus and reports
      # precision / recall / false-positive rate. Threshold is strict so quality
      # regressions are visible; the job is continue-on-error so it informs
      # without blocking while the corpus matures.
      - name: Run BugBench detection-quality gate
        run: python bughunter/tools/bench.py run --min-precision 1.0 --max-fp-rate 0.0
