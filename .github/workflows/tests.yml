name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

  tool-paths:
    name: tool paths resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Invoked tool paths must exist
        run: |
          # Every `bash|python3 <dir>/<file>.{py,sh}` in commands/ and skills/ must
          # resolve to a real file. Bare filenames (no slash) are external tools and
          # are skipped. Guards against the bughunter/ restructure leaving stale paths.
          missing=0
          while IFS= read -r p; do
            case "$p" in
              */*) if [ ! -f "$p" ]; then echo "MISSING: $p"; missing=1; fi ;;
              *)   : ;;
            esac
          done < <(grep -rhoE '(bash|python3?) [A-Za-z0-9/._-]+\.(py|sh)' commands/ skills/ \
                     | awk '{print $2}' | sort -u)
          if [ "$missing" -ne 0 ]; then
            echo "::error::command/skill docs reference tool paths that do not exist (see MISSING lines)"
            exit 1
          fi
          echo "All invoked tool paths resolve."
